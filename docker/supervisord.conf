[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:uvicorn]
command=/app/.venv/bin/uvicorn app.main:app --uds /tmp/app.sock --workers %(ENV_WEB_CONCURRENCY)s --proxy-headers --forwarded-allow-ips "*"
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=30

[program:nginx]
command=/bin/sh -c "while [ ! -S /tmp/app.sock ]; do sleep 0.2; done; exec nginx -g 'daemon off;'"
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=QUIT
stopwaitsecs=10
