name: CI/CD Pipeline - GCP Artifact Registry & Compute Engine VM

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

env:
  GAR_LOCATION: southamerica-east1
  GAR_REPOSITORY: webhook-payment
  IMAGE_NAME: app
  VM_NAME: instance-20260814-041635
  VM_ZONE: southamerica-east1-c

jobs:
  # ============================================================================
  # Job 1: Quality Gate (Linting & Unit/Integration Tests)
  # ============================================================================
  test:
    name: Code Quality & Automated Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Install Project Dependencies
        run: uv sync --dev

      - name: Run Ruff Linter & Formatter Check
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Pytest Suite with Coverage and JUnit Report
        run: |
          uv run pytest -v --cov=app --cov-report=xml:coverage.xml --cov-report=term-missing --junitxml=junit.xml

      - name: Upload coverage reports to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: ./junit.xml
          fail_ci_if_error: false

  # ============================================================================
  # Job 2: Build & Push Docker Image + Continuous Deployment to Compute Engine VM
  # ============================================================================
  build-and-push:
    name: Build, Push & Deploy to VM
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker Authentication for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Compute Engine VM via SSH
        run: |
          gcloud compute ssh ${{ env.VM_NAME }} \
            --zone=${{ env.VM_ZONE }} \
            --quiet \
            --command="
              sudo mkdir -p /app/data &&
              sudo chmod 777 /app/data &&
              gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet &&
              docker pull ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest &&
              docker stop webhook-payment || true &&
              docker rm webhook-payment || true &&
              docker run -d \
                --name webhook-payment \
                --restart always \
                -p 80:8080 \
                -v /app/data:/data \
                -v /app/privateKey.pem:/app/privateKey.pem:ro \
                -e DATABASE_URL='sqlite+aiosqlite:////data/webhook_payment.db' \
                -e ENVIRONMENT='sandbox' \
                -e STARK_PROJECT_ID='${{ secrets.STARK_PROJECT_ID }}' \
                -e STARK_PRIVATE_KEY_PATH='/app/privateKey.pem' \
                -e SCHEDULER_MODE='once' \
                -e SCHEDULER_INTERVAL_MINUTES='180' \
                ${{ env.GAR_LOCATION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.GAR_REPOSITORY }}/${{ env.IMAGE_NAME }}:latest
            "
